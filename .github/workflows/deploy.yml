name: 天气战士 · 抓数据

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 跳过抓取
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tjs-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取中国天气网官方数据
        if: ${{ github.event.inputs.skip_fetch != 'true' }}
        run: python tools/prefetch_official.py --workers 8
        continue-on-error: true

      - name: 提交数据变化
        continue-on-error: true
        run: |
          set -u
          git config user.name  "tjs-bot"
          git config user.email "tjs-bot@users.noreply.github.com"
          git add -A web/data/official
          if git diff --staged --quiet; then
            echo "官方数据无变化"
            exit 0
          fi
          git commit -m "chore(data): 预抓中国天气网数据 $(date -u '+%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "预抓数据已推送"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，重试…"
            sleep $((i * 3))
          done
          echo "::warning::连续 5 次推送失败，跳过提交"
